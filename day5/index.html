<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory</title>
    <script src="users.js" defer></script>
</head>
<body>

    <header>
        <h1>User Directory</h1>
        <p>Load and search users from a REST API.</p>
    </header>

    <main>
        <section>
            <h2>Users</h2>

            <button type="button" id="load-users">Load users</button>

            <div>
                <label for="filter-input">Filter users by name:</label>
                <input
                    type="search"
                    id="filter-input"
                    placeholder="Enter a user's name..."
                >
            </div>

            <p id="status" role="status" aria-live="polite">
                Click "Load users" to retrieve the users.
            </p>

            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 User Directory</p>
    </footer>

</body>
</html>
