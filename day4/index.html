<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Notes Toolkit</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Your simple note-taking toolkit.</p>
    </header>

    <main>
        <section class="note-card">
            <h2>Write your note</h2>

            <label for="note-text">Note content:</label>
            <textarea
                id="note-text"
                rows="8"
                placeholder="Start typing your note here..."
                aria-describedby="char-count word-count"
            ></textarea>

            <div class="counter-container">
                <p id="char-count" aria-live="polite">0 / 200 characters</p>
                <p id="word-count" aria-live="polite">0 words</p>
            </div>

            <div class="button-container">
                <button type="button" id="clear-btn">Clear note</button>
                <button type="button" id="theme-toggle">Dark mode</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes, developed with ❤️</p>
    </footer>

</body>
</html>
